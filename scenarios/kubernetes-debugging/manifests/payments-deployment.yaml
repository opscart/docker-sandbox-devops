---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: default
  labels:
    app: payments-service
    version: v1.2.3
    team: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      labels:
        app: payments-service
        version: v1.2.3
    spec:
      containers:
        - name: payments-service
          image: nginx:alpine          # placeholder — real image would be internal registry
          ports:
            - containerPort: 80
          env:
            - name: APP_ENV
              value: "development"
            - name: LOG_LEVEL
              value: "info"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always