---
# payments-service deployment
# Deliberately under-resourced memory limit to simulate OOMKill scenario.
# The service processes payment requests which require ~150Mi at peak load.
# Current limit of 64Mi causes OOMKill under normal traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: default
  labels:
    app: payments-service
    version: v1.2.3
    team: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      labels:
        app: payments-service
        version: v1.2.3
    spec:
      containers:
        - name: payments-service
          image: nginx:alpine          # placeholder — real image would be internal registry
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "development"
            - name: LOG_LEVEL
              value: "info"
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"          # too low — service needs ~150Mi at peak
            limits:
              cpu: "200m"
              memory: "64Mi"          # OOMKill happens here under load
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always